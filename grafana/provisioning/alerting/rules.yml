        data:
          - refId: A
            datasourceUid: cartracker-prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: '(1 - node_filesystem_avail_bytes{fstype!="tmpfs",mountpoint!~"/boot.*"} / node_filesystem_size_bytes{fstype!="tmpfs",mountpoint!~"/boot.*"}) * 100'
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
