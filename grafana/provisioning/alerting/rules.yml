apiVersion: 1

groups:

  - orgId: 1
    name: log-anomalies
    folder: Cartracker
    interval: 5m
    rules:

      - uid: ct-log-error-spike
        title: Log ERROR Spike
        condition: C
        noDataState: OK
        execErrState: Alerting
        for: 5m
        data:
          - refId: A
            datasourceUid: cartracker-loki
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: 'sum by (service) (count_over_time({service=~".+", level="ERROR"}[5m]))'
              queryType: range
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]

      - uid: ct-403-log-spike
        title: Scraper 403 Log Spike
        condition: C
        noDataState: OK
        execErrState: Alerting
        for: 5m
        data:
          - refId: A
            datasourceUid: cartracker-loki
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: 'count_over_time({service="scraper"} |= "403" [5m])'
              queryType: range
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [10]

      # Plan 131 Stage 5: pack verification failures must be zero. The deleter
      # logs REFUSED at ERROR and deletes nothing when a pack disagrees with its
      # sidecar or with the source object, so any occurrence is a real defect in
      # the read path Stage 4's safety rests on -- hence gt 0 and for: 0s rather
      # than the spike thresholds the other two log rules use.
      #
      # Both services: scheduled runs land on pack-worker (only it sets
      # ARCHIVER_ALLOW_PACK_JOBS), but the archiver still serves manual runs when
      # that flag is enabled for one.
      - uid: ct-pack-verification-refused
        title: Pack Verification REFUSED
        condition: C
        noDataState: OK
        execErrState: Alerting
        for: 0s
        annotations:
          summary: "Pack verification refused an object on {{ $labels.service }}"
          description: "delete_packed_source_html refused to delete a source object because its pack did not verify. Nothing was deleted. Read failures[] in the run summary, and pause the pack_bronze_html DAG before any further pruning. Run sheet: docs/runbook_plan_131_stage_3_4.md"
        data:
          - refId: A
            datasourceUid: cartracker-loki
            relativeTimeRange:
              from: 1200
              to: 0
            model:
              expr: 'sum by (service) (count_over_time({service=~"archiver|pack-worker"} |= "REFUSED" [10m]))'
              queryType: range
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 1200
              to: 0
            model:
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 1200
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

  - orgId: 1
    name: infra-and-data-health
    folder: Cartracker
    interval: 1m
    rules:

      - uid: ct-pipeline-failures
        title: Pipeline Task Failures
        condition: C
        noDataState: OK
        execErrState: Alerting
        for: 0s
        annotations:
          summary: "DAG {{ $labels.dag_id }} failed"
          description: "A DAG run failed in the last 10 min. Check the Airflow UI for details: https://cartracker.info/airflow"
        data:
          - refId: A
            datasourceUid: cartracker-prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: 'increase(airflow_dagrun_duration_failed_count[10m])'
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: ct-service-down
        title: Service Down
        condition: C
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        data:
          - refId: A
            datasourceUid: cartracker-prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: 'up{job=~"ops|processing"}'
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      - uid: ct-scrape-volume-drop
        title: Scrape Volume Drop
        condition: C
        noDataState: OK
        execErrState: Alerting
        for: 30m
        data:
          - refId: A
            datasourceUid: cartracker-prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: 'cartracker_observation_count_last_hour'
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [100]

      - uid: ct-extraction-yield-drop
        title: VIN Extraction Yield Drop
        condition: C
        noDataState: OK
        execErrState: Alerting
        for: 1h
        data:
          - refId: A
            datasourceUid: cartracker-prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: 'cartracker_extraction_yield_last_day'
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [90]

      - uid: ct-stale-listings
        title: Price Data Staleness
        condition: C
        noDataState: OK
        execErrState: Alerting
        for: 1h
        data:
          - refId: A
            datasourceUid: cartracker-prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: 'cartracker_stale_listings_pct'
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [20]

      - uid: ct-cooldown-backlog
        title: 403 Cooldown Backlog
        condition: C
        noDataState: OK
        execErrState: Alerting
        for: 30m
        data:
          - refId: A
            datasourceUid: cartracker-prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: 'cartracker_cooldown_backlog_high'
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5000]

      - uid: ct-disk-space-warning
        title: Disk Space Warning (>80%)
        condition: C
        noDataState: OK
        execErrState: Alerting
        for: 30m
        data:
          - refId: A
            datasourceUid: cartracker-prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: '(1 - node_filesystem_avail_bytes{fstype!="tmpfs",mountpoint!~"/boot.*"} / node_filesystem_size_bytes{fstype!="tmpfs",mountpoint!~"/boot.*"}) * 100'
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [80]

      - uid: ct-disk-space-critical
        title: Disk Space Critical (>90%)
        condition: C
        noDataState: OK
        execErrState: Alerting
        for: 5m
        data:
          - refId: A
            datasourceUid: cartracker-prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: '(1 - node_filesystem_avail_bytes{fstype!="tmpfs",mountpoint!~"/boot.*"} / node_filesystem_size_bytes{fstype!="tmpfs",mountpoint!~"/boot.*"}) * 100'
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [90]

      - uid: ct-block-events-spike
        title: 403 Block Events Spike
        condition: C
        noDataState: OK
        execErrState: Alerting
        for: 30m
        data:
          - refId: A
            datasourceUid: cartracker-prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: 'cartracker_block_events_last_hour'
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [200]
