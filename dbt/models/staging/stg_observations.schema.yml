version: 2

models:
  - name: stg_observations
    description: >
      Unified view of all parsed observations from the MinIO silver layer.
      One row per artifact observation — SRP cards, detail pages, and carousel items.
      vin17 is null when the raw VIN is absent, not 17 characters, or fails the
      ^[A-Z0-9]{17}$ format check. Most columns are nullable because observation
      completeness varies by source type.
    config:
      tags: ["hourly_core"]
      contract:
        enforced: true
    columns:
      - name: source
        data_type: string
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['srp', 'detail', 'carousel']
      - name: dealer_city
        data_type: string
        description: City of the dealer — passed through from silver, populated for detail source only.
      - name: dealer_state
        data_type: string
        description: State abbreviation of the dealer — passed through from silver, populated for detail source only.
      - name: body
        data_type: string
        description: Carousel-only body-style text, distinct from the detail/SRP body_style field.
      - name: condition
        data_type: string
        description: Carousel-only vehicle condition (e.g. new/used) text.
      - name: written_at
        data_type: timestamptz
        description: >
          Timestamp the row was written to silver — distinct from fetched_at
          (when the listing was observed). Used by int_listing_observation_fingerprints
          to break ties between rows that share a fetched_at (e.g. a reprocessing
          correction of an already-fetched artifact).
      - name: artifact_id
        data_type: bigint
      - name: listing_id
        data_type: string
      - name: listing_state
        data_type: string
      - name: fetched_at
        data_type: timestamptz
      - name: vin
        data_type: string
      - name: vin17
        data_type: string
      - name: price
        data_type: integer
      - name: make
        data_type: string
      - name: model
        data_type: string
      - name: vehicle_trim
        data_type: string
      - name: model_year
        data_type: smallint
      - name: mileage
        data_type: integer
      - name: msrp
        data_type: integer
      - name: stock_type
        data_type: string
      - name: fuel_type
        data_type: string
      - name: body_style
        data_type: string
      - name: dealer_name
        data_type: string
      - name: dealer_zip
        data_type: string
      - name: customer_id
        data_type: string
      - name: canonical_detail_url
        data_type: string
      - name: financing_type
        data_type: string
      - name: seller_zip
        data_type: string
      - name: seller_customer_id
        data_type: string
      - name: page_number
        data_type: smallint
      - name: position_on_page
        data_type: smallint
      - name: trid
        data_type: string
      - name: isa_context
        data_type: string
