  - name: test_batch_observation_without_a_timestamp_is_dropped
    description: >
      obs_date is date_trunc('day', fetched_at), so an observation with no
      fetched_at has no day to belong to and is excluded before grouping. It is
      excluded from the yield denominator too: the surviving day reports
      extraction_yield 100.0, not 50.0.
    model: mart_detail_batch_outcomes
    given:
      - input: ref('stg_observations')
        format: sql
        rows: |
          select cast(1 as bigint) as artifact_id,
                 cast('L1' as varchar) as listing_id,
                 cast('detail' as varchar) as source,
                 cast(null as varchar) as listing_state,
                 cast('2026-01-10 10:00:00+00' as timestamp) as fetched_at,
                 cast(null as timestamp) as written_at,
                 cast(null as varchar) as vin,
                 cast('VALIDVIN00000001A' as varchar) as vin17,
                 cast(null as integer) as price,
                 cast(null as varchar) as make,
                 cast(null as varchar) as model,
                 cast(null as varchar) as vehicle_trim,
                 cast(null as smallint) as model_year,
                 cast(null as integer) as mileage,
                 cast(null as integer) as msrp,
                 cast(null as varchar) as stock_type,
                 cast(null as varchar) as fuel_type,
                 cast(null as varchar) as body_style,
                 cast(null as varchar) as dealer_name,
                 cast(null as varchar) as dealer_zip,
                 cast(null as varchar) as dealer_city,
                 cast(null as varchar) as dealer_state,
                 cast(null as varchar) as customer_id,
                 cast(null as varchar) as canonical_detail_url,
                 cast(null as varchar) as financing_type,
                 cast(null as varchar) as seller_zip,
                 cast(null as varchar) as seller_customer_id,
                 cast(null as smallint) as page_number,
                 cast(null as smallint) as position_on_page,
                 cast(null as varchar) as trid,
                 cast(null as varchar) as isa_context,
                 cast(null as varchar) as body,
                 cast(null as varchar) as condition
          -- fails `fetched_at is not null`
          union all select 2, 'L2', 'detail', null, cast(null as timestamp), null,
                 null, null, null, null, null, null, null, null, null, null,
                 null, null, null, null, null, null, null, null, null, null,
                 null, null, null, null, null, null, null
    expect:
      rows:
        - {obs_date: "2026-01-10", detail_observations: 1, detail_artifacts: 1,
           valid_vin_count: 1, unique_vins_enriched: 1, extraction_yield: 100.0}

  # ===========================================================================
  # mart_inventory_coverage
  # ===========================================================================

  # Branch: mart_inventory_coverage.<final>.where_conjunct.0 (model is not null).

  - name: test_coverage_null_model_excluded
    description: >
      make and model are separate guards. A VIN carrying a make but no model is
      excluded, so it neither forms a (make, null) group of its own nor inflates
      the total_vins of the make/model group beside it.
    model: mart_inventory_coverage
    given:
      - input: ref('int_latest_observation')
        rows:
          - {vin17: "NOMODEL0000000001", make: "honda", model: null, source: "detail"}
          - {vin17: "HASMODEL000000002", make: "honda", model: "crv", source: "detail"}
    expect:
      rows:
        - {make: "honda", model: "crv", total_vins: 1, detail_enriched: 1,
           srp_only: 0, coverage_pct: 100.0}

  # ===========================================================================
  # mart_price_freshness_trend
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Branches: <final>.agg_filter.1 (1-3 days), .2 (4-7 days), .3 (8-14 days).
  #
  # The model calls now() directly rather than through the now_ts() macro, so
  # there is nothing to pin with `overrides`. The fixture therefore states its
  # timestamps RELATIVE to now(): a test written with absolute dates would drift
  # out of its own buckets as the calendar moved, which is the live defect this
  # stage already found once in mart_vehicle_snapshot's fixture data.
  # ---------------------------------------------------------------------------

  - name: test_freshness_buckets_partition_the_active_listings
    description: >
      Five active VINs in one make/model, priced-observed 0, 2, 5, 10 and 30
      days ago, land one in each of the five freshness buckets. The buckets are
      a partition, so every VIN is counted exactly once and the five counts sum
      to total_vins; fresh_lt_7d_pct is the three at or under seven days.
    model: mart_price_freshness_trend
    given:
      - input: ref('mart_vehicle_snapshot')
        format: sql
        rows: |
          select cast('honda' as varchar) as make,
                 cast('crv' as varchar) as model,
                 cast('active' as varchar) as listing_state,
                 now() as price_observed_at
          union all select 'honda', 'crv', 'active', now() - interval '2 days'
          union all select 'honda', 'crv', 'active', now() - interval '5 days'
          union all select 'honda', 'crv', 'active', now() - interval '10 days'
          union all select 'honda', 'crv', 'active', now() - interval '30 days'
    expect:
      rows:
        - {make: "honda", model: "crv", total_vins: 5,
           fresh_lt_1d: 1, fresh_1_3d: 1, fresh_4_7d: 1, fresh_8_14d: 1,
           stale_gt_14d: 1, fresh_lt_7d_pct: 60.0}

