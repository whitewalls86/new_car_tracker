# mart_scrape_volume in its WARM form, which nothing else tests
# -----------------------------------------------------------------------------
# Plan 162 Stage S. The mart_scrape_volume tests in ../unit_tests.yml all pin
# `is_incremental: false`, so the recent-window filter added by Plan 123 Phase 5
# — and the `fetched_at is not null` reject as it is ordered *inside* that warm
# WHERE clause — had never been rendered by a unit test. These two render it,
# with `overrides: {macros: {is_incremental: true}}` and the target relation
# supplied by `- input: this`.
#
# Two tests and not one, for the same reason as the fingerprint models: the
# watermark is `coalesce(max(hour), timestamp '1900-01-01')` over the whole
# target relation, so `max(hour) is null` is a property of that relation rather
# than of a row and only one of its arms can hold per test. The cold-start test
# mocks `this` EMPTY; the warm test mocks it with a row.
#
# Both assert the aggregate the model is for — artifact_count collapsing two
# observations from one artifact, unique_listings counting them separately,
# vin_extraction_pct being a detail-only percentage — and not merely that some
# row survived the filter. The window is what is under test, but a test that
# only counted rows would keep passing if the aggregation broke.
#
# See ../unit_tests.yml for why the stg_observations fixture is `format: sql`
# with all 33 columns spelled out (it is ephemeral on the spark target, so dict
# fixtures cannot introspect it). The `this` fixture is dict-form because the
# target IS a materialized table on every engine.

unit_tests:

  - name: test_scrape_volume_incremental_cold_start_scans_from_1900
    description: "First incremental build: empty target, so the watermark falls back to 1900-01-01 and every hour from then on is aggregated; null-fetched_at rows are still rejected"
    model: mart_scrape_volume
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        rows: []
      - input: ref('stg_observations')
        format: sql
        rows: |
          select cast(1 as bigint) as artifact_id,
                 cast('L1' as string) as listing_id,
                 cast('detail' as string) as source,
                 cast(null as string) as listing_state,
                 cast('2026-01-10 10:00:00+00' as timestamp) as fetched_at,
                 cast(null as timestamp) as written_at,
                 cast(null as string) as vin,
                 cast('VALIDVIN00000001A' as string) as vin17,
                 cast(null as integer) as price,
                 cast(null as string) as make,
                 cast(null as string) as model,
                 cast(null as string) as vehicle_trim,
                 cast(null as smallint) as model_year,
                 cast(null as integer) as mileage,
                 cast(null as integer) as msrp,
                 cast(null as string) as stock_type,
                 cast(null as string) as fuel_type,
                 cast(null as string) as body_style,
                 cast(null as string) as dealer_name,
                 cast(null as string) as dealer_zip,
                 cast(null as string) as dealer_city,
                 cast(null as string) as dealer_state,
                 cast(null as string) as customer_id,
                 cast(null as string) as canonical_detail_url,
                 cast(null as string) as financing_type,
                 cast(null as string) as seller_zip,
                 cast(null as string) as seller_customer_id,
                 cast(null as smallint) as page_number,
                 cast(null as smallint) as position_on_page,
                 cast(null as string) as trid,
                 cast(null as string) as isa_context,
                 cast(null as string) as body,
                 cast(null as string) as condition
          -- same artifact and same hour as the row above: artifact_count 1, observation_count 2
          union all select 1, 'L2', 'detail', null, cast('2026-01-10 10:30:00+00' as timestamp), null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null
          -- rejected: fetched_at is null, so the row has no hour to be counted in
          union all select 2, 'L3', 'detail', null, cast(null as timestamp), null, null, 'VALIDVIN00000003A', null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null
          -- rejected: below the cold-start floor of 1900-01-01 minus 72 hours
          union all select 3, 'L4', 'srp', null, cast('1899-12-01 00:00:00+00' as timestamp), null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null
    expect:
      rows:
        - {hour: "2026-01-10 10:00:00", source: "detail", artifact_count: 1, observation_count: 2, unique_listings: 2, valid_vin_count: 1, vin_extraction_pct: 50.0}

  - name: test_scrape_volume_incremental_warm_watermark_bounds_the_window
    description: "Non-empty target: the window is max(hour) minus 72 hours, so an older hour is not recomputed; null-fetched_at rows are still rejected"
    model: mart_scrape_volume
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        rows:
          - {scrape_volume_key: "existing", hour: "2026-01-10 10:00:00", source: "detail", artifact_count: 1, observation_count: 1, unique_listings: 1, valid_vin_count: 1, vin_extraction_pct: 100.0}
      - input: ref('stg_observations')
        format: sql
        rows: |
          select cast(1 as bigint) as artifact_id,
                 cast('L1' as string) as listing_id,
                 cast('srp' as string) as source,
                 cast(null as string) as listing_state,
                 cast('2026-01-10 09:00:00+00' as timestamp) as fetched_at,
                 cast(null as timestamp) as written_at,
                 cast(null as string) as vin,
                 cast(null as string) as vin17,
                 cast(null as integer) as price,
                 cast(null as string) as make,
                 cast(null as string) as model,
                 cast(null as string) as vehicle_trim,
                 cast(null as smallint) as model_year,
                 cast(null as integer) as mileage,
                 cast(null as integer) as msrp,
                 cast(null as string) as stock_type,
                 cast(null as string) as fuel_type,
                 cast(null as string) as body_style,
                 cast(null as string) as dealer_name,
                 cast(null as string) as dealer_zip,
                 cast(null as string) as dealer_city,
                 cast(null as string) as dealer_state,
                 cast(null as string) as customer_id,
                 cast(null as string) as canonical_detail_url,
                 cast(null as string) as financing_type,
                 cast(null as string) as seller_zip,
                 cast(null as string) as seller_customer_id,
                 cast(null as smallint) as page_number,
                 cast(null as smallint) as position_on_page,
                 cast(null as string) as trid,
                 cast(null as string) as isa_context,
                 cast(null as string) as body,
                 cast(null as string) as condition
          -- rejected: nine days older than the target's max hour, so outside the 72-hour window
          union all select 2, 'L2', 'srp', null, cast('2026-01-01 09:00:00+00' as timestamp), null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null
          -- rejected: fetched_at is null, so the row has no hour to be counted in
          union all select 3, 'L3', 'srp', null, cast(null as timestamp), null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null
    expect:
      rows:
        - {hour: "2026-01-10 09:00:00", source: "srp", artifact_count: 1, observation_count: 1, unique_listings: 1, valid_vin_count: 0, vin_extraction_pct: null}

  # The one cold-form test in this file, and it is here because of what the two
  # above CANNOT show.
  #
  # `where fetched_at is not null` is redundant in the warm form: the very next
  # conjunct is `date_trunc('hour', fetched_at) >= <watermark>`, and a null
  # fetched_at makes that comparison null, so the row is dropped either way.
  # Measured, not reasoned: with the null filter deleted from the model, both
  # tests above still pass. They take the filter's false arm — the branch
  # instrument is right that they reach it — but nothing about their result
  # depends on the filter existing, and a test that reaches a branch while
  # asserting nothing about it is worse than no test, because it reports
  # coverage.
  #
  # Deleting the filter is only observable on a first run or a --full-refresh,
  # where there is no watermark conjunct to mask it and the null row becomes its
  # own `hour is null` group. That is what this test pins.
  - name: test_scrape_volume_full_scan_rejects_null_fetched_at
    description: "Full scan (no watermark conjunct to mask it): a row with null fetched_at is dropped rather than forming an hour-is-null group"
    model: mart_scrape_volume
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_observations')
        format: sql
        rows: |
          select cast(1 as bigint) as artifact_id,
                 cast('L1' as string) as listing_id,
                 cast('detail' as string) as source,
                 cast(null as string) as listing_state,
                 cast('2026-01-10 10:00:00+00' as timestamp) as fetched_at,
                 cast(null as timestamp) as written_at,
                 cast(null as string) as vin,
                 cast('VALIDVIN00000001A' as string) as vin17,
                 cast(null as integer) as price,
                 cast(null as string) as make,
                 cast(null as string) as model,
                 cast(null as string) as vehicle_trim,
                 cast(null as smallint) as model_year,
                 cast(null as integer) as mileage,
                 cast(null as integer) as msrp,
                 cast(null as string) as stock_type,
                 cast(null as string) as fuel_type,
                 cast(null as string) as body_style,
                 cast(null as string) as dealer_name,
                 cast(null as string) as dealer_zip,
                 cast(null as string) as dealer_city,
                 cast(null as string) as dealer_state,
                 cast(null as string) as customer_id,
                 cast(null as string) as canonical_detail_url,
                 cast(null as string) as financing_type,
                 cast(null as string) as seller_zip,
                 cast(null as string) as seller_customer_id,
                 cast(null as smallint) as page_number,
                 cast(null as smallint) as position_on_page,
                 cast(null as string) as trid,
                 cast(null as string) as isa_context,
                 cast(null as string) as body,
                 cast(null as string) as condition
          -- rejected: without the null filter this row is an `hour is null` group of its own
          union all select 2, 'L2', 'detail', null, cast(null as timestamp), null, null, 'VALIDVIN00000002A', null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null
    expect:
      rows:
        - {hour: "2026-01-10 10:00:00", source: "detail", artifact_count: 1, observation_count: 1, unique_listings: 1, valid_vin_count: 1, vin_extraction_pct: 100.0}
