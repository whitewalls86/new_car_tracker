version: 2

models:
  - name: int_latest_observation
    description: >
      One row per VIN17 — the single best observation for each vehicle.
      Source priority: detail > srp > carousel. Within a source, most recent
      fetched_at wins (artifact_id as tiebreaker). Rows with null vin17 or null
      make are excluded. The canonical source of vehicle attributes for all
      downstream marts.
      Incremental (Plan 123 Phase 5): affected-VIN replacement, unique_key='vin17'.
      On an incremental run, only VINs with a stg_observations row inside
      latest_observation_incremental_lookback_days of the target's
      max(fetched_at) are rescanned, but their COMPLETE observation history is
      reread and reranked, since source-priority means an older detail row can
      beat a newer SRP/carousel one — scoping the rerank to only recent rows
      would be wrong.
    config:
      tags: ["hourly_core"]
      contract:
        enforced: true
      on_schema_change: fail
    columns:
      - name: vin17
        data_type: string
        data_tests:
          - not_null
          - unique
      - name: source
        data_type: string
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['srp', 'detail', 'carousel']
      - name: make
        data_type: string
        data_tests:
          - not_null
      - name: artifact_id
        data_type: bigint
      - name: listing_id
        data_type: string
      - name: listing_state
        data_type: string
      - name: fetched_at
        data_type: timestamptz
      - name: written_at
        data_type: timestamptz
      - name: vin
        data_type: string
      - name: price
        data_type: integer
      - name: model
        data_type: string
      - name: vehicle_trim
        data_type: string
      - name: model_year
        data_type: smallint
      - name: mileage
        data_type: integer
      - name: msrp
        data_type: integer
      - name: stock_type
        data_type: string
      - name: fuel_type
        data_type: string
      - name: body_style
        data_type: string
      - name: dealer_name
        data_type: string
      - name: dealer_zip
        data_type: string
      - name: dealer_city
        data_type: string
      - name: dealer_state
        data_type: string
      - name: customer_id
        data_type: string
      - name: canonical_detail_url
        data_type: string
      - name: financing_type
        data_type: string
      - name: seller_zip
        data_type: string
      - name: seller_customer_id
        data_type: string
      - name: page_number
        data_type: smallint
      - name: position_on_page
        data_type: smallint
      - name: trid
        data_type: string
      - name: isa_context
        data_type: string
      - name: body
        data_type: string
      - name: condition
        data_type: string
