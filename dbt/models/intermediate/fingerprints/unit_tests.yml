# Fingerprint coverage — Plan 162 Stage S, exit 2
#
# Every branch in int_listing_observation_fingerprints and
# int_listing_state_fingerprints that a unit test can reach, exercised in both
# directions. Almost all of them are the `coalesce(field, '')` guards inside the
# two md5 concats: the branch is "was this field NULL?", so both arms means one
# `given` row where it is null and another where it is not.
#
# **The assertion is the hash itself, computed outside dbt.** Each expected
# parsed_fingerprint below is md5 of the pipe-joined field values, worked out
# from the model's field list rather than read back off a run — so a coalesce
# that stopped normalizing (concat_ws SKIPS a NULL argument rather than
# rendering it empty, which silently shortens the string by one separator)
# changes the hash and fails here.
#
# **Why this is a second file, and why it is in a subdirectory called
# unit_tests.yml rather than beside the models as unit_tests_fingerprints.yml.**
# Separate file, because two people were writing the intermediate models' unit
# tests at once. Named `unit_tests.yml`, because the branch instrument matches
# on that exact filename in both directions and neither is optional:
# `branch_probe.compiled_unit_tests()` finds a test's model by globbing
# `dbt/models/**/unit_tests.yml`, so a differently-named file earns no branch
# credit at all -- and `branch_list.compiled_model_paths()` skips compiled paths
# containing `unit_tests.yml`, so a differently-named file is read back as N
# extra *models* and its every mocked branch is filed as an uncovered branch of
# a model that does not exist. Measured: `unit_tests_fingerprints.yml` added 62
# phantom coverage gaps and turned the gate red. dbt reads every .yml under
# models/, so the directory costs nothing.
#
# Not covered here, and why. Both reasons are properties of the models, not
# gaps in these tests, and neither is closable by adding `given` rows:
#
#   * **Four dead guards.** `coalesce(listing_id, '')` (twice) and
#     `coalesce(source, '')` in the observation model, and `coalesce(vin17, '')`
#     in the state model, all sit in `fingerprinted`, whose only input is
#     `source_rows` — which already filters `listing_id is not null`,
#     `source in ('detail','srp','carousel')` and `vin17 is not null`. The NULL
#     arm cannot be reached from inside the model at all. Correct to leave in
#     the SQL (the guard is free and the filter could move), wrong to count as
#     coverable.
#   * **Four branches that exist only in the incremental compile** — the
#     `source = 'detail'` / `source in (...)` conjunct at its shifted ordinal,
#     and the `coalesce(max(fetched_at), ...)` cold-start guard inside the
#     lookback subquery. A unit test renders the cold form, so it never emits
#     those ids. Forcing the incremental form with an `is_incremental: true`
#     macro override was tried on 2026-09-07 and is worse: it closed
#     neither branch (the cold-start guard is a scalar probe, which reports one
#     arm by construction) and it emitted two `@full`-tagged ids for branches
#     the cold compile does not have, both one-armed and unwaived, turning
#     test_every_branch_is_exercised_in_both_directions_or_declared red.

unit_tests:

  # ---------------------------------------------------------------------------
  # int_listing_observation_fingerprints
  # ---------------------------------------------------------------------------

  - name: test_observation_fingerprint_treats_null_as_empty_in_every_field
    description: >
      Every one of the 29 fields in the observation fingerprint is NULL-safe:
      a row with each field populated, a row with each field NULL, and a row
      with each string field explicitly empty. The last two must hash
      identically — that is what `coalesce(field, '')` claims — and neither
      may collide with the populated row.
    model: int_listing_observation_fingerprints
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_observations')
        format: sql
        rows: |
          select cast(1 as bigint) as artifact_id,
                 cast('L1' as string) as listing_id,
                 cast('detail' as string) as source,
                 cast('active' as string) as listing_state,
                 cast('2026-01-10 12:00:00+00' as timestamp) as fetched_at,
                 cast('2026-01-10 12:05:00+00' as timestamp) as written_at,
                 cast(null as string) as vin,
                 cast('1HGBH41JXMN109186' as string) as vin17,
                 cast(30000 as integer) as price,
                 cast('Honda' as string) as make,
                 cast('Accord' as string) as model,
                 cast('EX-L' as string) as vehicle_trim,
                 cast(2021 as smallint) as model_year,
                 cast(12000 as integer) as mileage,
                 cast(32000 as integer) as msrp,
                 cast('used' as string) as stock_type,
                 cast('gas' as string) as fuel_type,
                 cast('sedan' as string) as body_style,
                 cast('Metro Honda' as string) as dealer_name,
                 cast('60601' as string) as dealer_zip,
                 cast('Chicago' as string) as dealer_city,
                 cast('IL' as string) as dealer_state,
                 cast('C-100' as string) as customer_id,
                 cast('https://example.com/vdp/1' as string) as canonical_detail_url,
                 cast('cash' as string) as financing_type,
                 cast('60602' as string) as seller_zip,
                 cast('SC-200' as string) as seller_customer_id,
                 cast(2 as smallint) as page_number,
                 cast(7 as smallint) as position_on_page,
                 cast('TR-300' as string) as trid,
                 cast('srp-isa' as string) as isa_context,
                 cast('Sedan' as string) as body,
                 cast('Used' as string) as condition
          union all select 2, 'L1', 'detail', null, cast('2026-01-10 12:00:00+00' as timestamp), cast(null as timestamp), null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null
          union all select 3, 'L1', 'detail', '', cast('2026-01-10 12:00:00+00' as timestamp), cast(null as timestamp), '', '', null, '', '', '', null, null, null, '', '', '', '', '', '', '', '', '', '', '', '', null, null, '', '', '', ''
    expect:
      rows:
        - {artifact_id: 1, listing_id: "L1", parsed_fingerprint: "e1c60ec8a5cde6249216da3f2c90cc7a"}
        - {artifact_id: 2, listing_id: "L1", parsed_fingerprint: "ee832a4da2a1563fc480e2787f19a9ad"}
        - {artifact_id: 3, listing_id: "L1", parsed_fingerprint: "ee832a4da2a1563fc480e2787f19a9ad"}

  - name: test_observation_fingerprint_drops_sources_outside_the_indexed_three
    description: >
      The model reads detail, SRP and carousel artifacts. A row from any other
      source — here an 'api' artifact carrying the same listing_id — is not a
      cadence observation and must not reach the output at all.
    model: int_listing_observation_fingerprints
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_observations')
        format: sql
        rows: |
          select cast(10 as bigint) as artifact_id,
                 cast('L9' as string) as listing_id,
                 cast('detail' as string) as source,
                 cast(null as string) as listing_state,
                 cast('2026-01-11 00:00:00+00' as timestamp) as fetched_at,
                 cast(null as timestamp) as written_at,
                 cast(null as string) as vin,
                 cast('1HGBH41JXMN109186' as string) as vin17,
                 cast(null as integer) as price,
                 cast(null as string) as make,
                 cast(null as string) as model,
                 cast(null as string) as vehicle_trim,
                 cast(null as smallint) as model_year,
                 cast(null as integer) as mileage,
                 cast(null as integer) as msrp,
                 cast(null as string) as stock_type,
                 cast(null as string) as fuel_type,
                 cast(null as string) as body_style,
                 cast(null as string) as dealer_name,
                 cast(null as string) as dealer_zip,
                 cast(null as string) as dealer_city,
                 cast(null as string) as dealer_state,
                 cast(null as string) as customer_id,
                 cast(null as string) as canonical_detail_url,
                 cast(null as string) as financing_type,
                 cast(null as string) as seller_zip,
                 cast(null as string) as seller_customer_id,
                 cast(null as smallint) as page_number,
                 cast(null as smallint) as position_on_page,
                 cast(null as string) as trid,
                 cast(null as string) as isa_context,
                 cast(null as string) as body,
                 cast(null as string) as condition
          union all select 11, 'L9', 'api', null, cast('2026-01-11 01:00:00+00' as timestamp), cast(null as timestamp), null, '1HGBH41JXMN109186', null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null
    expect:
      rows:
        - {artifact_id: 10, listing_id: "L9", source: "detail",
           parsed_fingerprint: "153b22f35ffe3c915a7b43f1470b8b6f"}

  # ---------------------------------------------------------------------------
  # int_listing_state_fingerprints
  # ---------------------------------------------------------------------------

  - name: test_state_fingerprint_treats_null_as_empty_in_every_field
    description: >
      The detail-only fingerprint's 18 fields, same three-row shape as the
      observation test above: populated, all-NULL, all-empty-string. The
      all-NULL and all-empty rows must hash identically, and differently from
      the populated one.
    model: int_listing_state_fingerprints
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_observations')
        format: sql
        rows: |
          select cast(1 as bigint) as artifact_id,
                 cast('L1' as string) as listing_id,
                 cast('detail' as string) as source,
                 cast('active' as string) as listing_state,
                 cast('2026-01-10 12:00:00+00' as timestamp) as fetched_at,
                 cast('2026-01-10 12:05:00+00' as timestamp) as written_at,
                 cast(null as string) as vin,
                 cast('1HGBH41JXMN109186' as string) as vin17,
                 cast(30000 as integer) as price,
                 cast('Honda' as string) as make,
                 cast('Accord' as string) as model,
                 cast('EX-L' as string) as vehicle_trim,
                 cast(2021 as smallint) as model_year,
                 cast(12000 as integer) as mileage,
                 cast(32000 as integer) as msrp,
                 cast('used' as string) as stock_type,
                 cast('gas' as string) as fuel_type,
                 cast('sedan' as string) as body_style,
                 cast('Metro Honda' as string) as dealer_name,
                 cast('60601' as string) as dealer_zip,
                 cast('Chicago' as string) as dealer_city,
                 cast('IL' as string) as dealer_state,
                 cast('C-100' as string) as customer_id,
                 cast('https://example.com/vdp/1' as string) as canonical_detail_url,
                 cast('cash' as string) as financing_type,
                 cast('60602' as string) as seller_zip,
                 cast('SC-200' as string) as seller_customer_id,
                 cast(2 as smallint) as page_number,
                 cast(7 as smallint) as position_on_page,
                 cast('TR-300' as string) as trid,
                 cast('srp-isa' as string) as isa_context,
                 cast('Sedan' as string) as body,
                 cast('Used' as string) as condition
          union all select 2, null, 'detail', null, cast('2026-01-10 12:00:00+00' as timestamp), cast(null as timestamp), null, '1HGBH41JXMN109186', null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null
          union all select 3, '', 'detail', '', cast('2026-01-10 12:00:00+00' as timestamp), cast(null as timestamp), '', '1HGBH41JXMN109186', null, '', '', '', null, null, null, '', '', '', '', '', '', '', '', '', '', '', '', null, null, '', '', '', ''
    expect:
      rows:
        - {artifact_id: 1, parsed_fingerprint: "4567b58caf245b2eafd6a7a8624761fb"}
        - {artifact_id: 2, parsed_fingerprint: "a74fa3c165e4576ffca47098b0bc38c6"}
        - {artifact_id: 3, parsed_fingerprint: "a74fa3c165e4576ffca47098b0bc38c6"}

  - name: test_state_fingerprint_keeps_only_the_freshest_row_per_artifact
    description: >
      artifact_id is the unique key, and delete+insert does not collapse two
      rows that share one inside a single batch — the row_number() dedupe does.
      Two observations of artifact 50, four days apart at different prices:
      only the later one survives, and it carries the later price.
    model: int_listing_state_fingerprints
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_observations')
        format: sql
        rows: |
          select cast(50 as bigint) as artifact_id,
                 cast('L5' as string) as listing_id,
                 cast('detail' as string) as source,
                 cast(null as string) as listing_state,
                 cast('2026-01-02 00:00:00+00' as timestamp) as fetched_at,
                 cast(null as timestamp) as written_at,
                 cast(null as string) as vin,
                 cast('1HGBH41JXMN109186' as string) as vin17,
                 cast(28000 as integer) as price,
                 cast(null as string) as make,
                 cast(null as string) as model,
                 cast(null as string) as vehicle_trim,
                 cast(null as smallint) as model_year,
                 cast(null as integer) as mileage,
                 cast(null as integer) as msrp,
                 cast(null as string) as stock_type,
                 cast(null as string) as fuel_type,
                 cast(null as string) as body_style,
                 cast(null as string) as dealer_name,
                 cast(null as string) as dealer_zip,
                 cast(null as string) as dealer_city,
                 cast(null as string) as dealer_state,
                 cast(null as string) as customer_id,
                 cast(null as string) as canonical_detail_url,
                 cast(null as string) as financing_type,
                 cast(null as string) as seller_zip,
                 cast(null as string) as seller_customer_id,
                 cast(null as smallint) as page_number,
                 cast(null as smallint) as position_on_page,
                 cast(null as string) as trid,
                 cast(null as string) as isa_context,
                 cast(null as string) as body,
                 cast(null as string) as condition
          union all select 50, 'L5', 'detail', null, cast('2026-01-01 00:00:00+00' as timestamp), cast(null as timestamp), null, '1HGBH41JXMN109186', 30000, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null
    expect:
      rows:
        - {artifact_id: 50, listing_id: "L5", price: 28000,
           parsed_fingerprint: "5d90da24499aead84489c2d6958a99b1"}
