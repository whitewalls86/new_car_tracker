auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # Loki's own boltdb-shipper chatter is ~9 lines/sec at info, all of it index
  # handover bookkeeping (8.6 GB accumulated, 2 errors per 2M lines). Raise it
  # temporarily for troubleshooting with POST /log_level?log_level=debug — that
  # takes effect without a restart and reverts to this value when the container
  # restarts. See docs/plan_135_storage_observability.md.
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

# Loki is the durable store; the files Promtail tails and Docker's json logs are
# bounded transport buffers. Keep one generous retention policy here rather
# than attempting to age data independently at every producer.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  retention_period: 90d

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093
