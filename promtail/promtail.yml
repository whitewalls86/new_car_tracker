server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  # Survive Promtail recreation so retained Docker stdout is not replayed.
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # Container stdout is normally only a bounded Docker transport buffer. Keep
  # the auth audit trail and Airflow control-plane logs in Loki, while excluding
  # Loki itself (which would create a feedback loop) and low-value containers.
  - job_name: docker-operations
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
        filters:
          - name: label
            values: ['promtail.enable=true']
    relabel_configs:
      - target_label: job
        replacement: docker-operations
      - source_labels: ['__meta_docker_container_name']
        regex: '/cartracker-(.+)'
        target_label: service
        replacement: '$1'
      - target_label: source
        replacement: container_stdout
    pipeline_stages:
      - docker: {}
      # Parse severity before filtering: words in logger names and message
      # bodies are not severity. Three shapes reach these containers and all
      # three must classify, because an unmatched line is dropped rather than
      # retained without a level -- structlog `<ts> [error    ]` (the shape
      # sampled in production), the gunicorn supervisor's `[ts] [7] [CRITICAL]`,
      # and the classic `[ts] {file.py:123} ERROR -`. Requiring severity in the
      # second or third whitespace field matched only the first of those.
      # Kept identical to AIRFLOW_LEVEL_PATTERN in shared/log_ingestion_policy;
      # test_airflow_container_stdout_parses_then_filters_severity asserts it.
      # Unparsed continuation lines, including tracebacks, stay excluded.
      - match:
          selector: '{service=~"airflow-(apiserver|scheduler|dag-processor)"}'
          stages:
            - regex:
                expression: '^(?:.{0,80}?\[\s*|(?:\[[^\]]*\]\s+)?\{[^}]*\}\s+|)(?P<level>(?i:debug|info|warning|error|critical))\b'
            - template:
                source: level
                template: '{{ ToUpper .Value }}'
            - labels:
                level:
      - match:
          selector: '{service=~"airflow-(apiserver|scheduler|dag-processor)", level=""}'
          action: drop
          drop_counter_reason: airflow_unclassified_control_plane
      - match:
          selector: '{service=~"airflow-(apiserver|scheduler|dag-processor)", level=~"DEBUG|INFO"}'
          action: drop
          drop_counter_reason: airflow_non_actionable_control_plane
      # OAuth access records carry a numeric status but no severity. HTTP 4xx
      # is WARNING, 5xx is ERROR, and the remaining access/lifecycle records
      # are INFO unless the native lifecycle text begins Warning:/Error:.
      - match:
          selector: '{service="oauth2-proxy"}'
          stages:
            - regex:
                expression: '^.*?\s(?P<method>[A-Z]+) - "(?P<path>[^"]+)" HTTP/[0-9.]+ "[^"]*" (?P<status>[0-9]{3}) \d+ [0-9.]+$'
            - regex:
                expression: '^\[[^\]]+\]\s+\[[^\]]+\]\s+(?P<oauth_level>Warning|ERROR|Error):'
            - labels:
                status:
                oauth_level:
            - template:
                source: level
                template: INFO
            - match:
                selector: '{status=~"4.."}'
                stages:
                  - template:
                      source: level
                      template: WARNING
            - match:
                selector: '{status=~"5.."}'
                stages:
                  - template:
                      source: level
                      template: ERROR
            - match:
                selector: '{oauth_level="Warning"}'
                stages:
                  - template:
                      source: level
                      template: WARNING
            - match:
                selector: '{oauth_level=~"ERROR|Error"}'
                stages:
                  - template:
                      source: level
                      template: ERROR
            - labels:
                level:
            - labeldrop:
                - oauth_level
            # Grafana performs this successful auth subrequest for nearly
            # every datasource request. Do not store its PII-bearing echo.
            - match:
                selector: '{status="202"}'
                stages:
                  - drop:
                      source: path
                      expression: '^/oauth2/auth(?:\?.*)?$'
                      drop_counter_reason: oauth2_successful_auth_subrequest
      # Plan 154 Stage B. `log_line_prefix = '%m [%p] '` puts the severity
      # straight after the pid. Parse it, drop the routine server log, then map
      # what remains onto the normalized levels. Kept identical to
      # POSTGRES_SEVERITY_PATTERN and POSTGRES_LEVEL_MAP in
      # shared/log_ingestion_policy; the fixture tests assert the pair agree.
      - match:
          selector: '{service="postgres"}'
          stages:
            - regex:
                expression: '^\d{4}-\d{2}-\d{2} [\d:.]+ \w+ \[\d+\] (?P<pg_level>[A-Z0-9]+):'
            - labels:
                pg_level:
      - match:
          selector: '{service="postgres", pg_level=""}'
          action: drop
          drop_counter_reason: postgres_unparsed_record
      # The 288 daily checkpoint records postgres-exporter already covers.
      - match:
          selector: '{service="postgres", pg_level=~"LOG|DEBUG|INFO|NOTICE"}'
          action: drop
          drop_counter_reason: postgres_routine_server_log
      - match:
          selector: '{service="postgres"}'
          stages:
            # FATAL ends one session; PANIC ends the server. Stage A found most
            # FATALs are ad-hoc psql sessions guessing at role names, so FATAL
            # maps to ERROR rather than CRITICAL.
            - match:
                selector: '{pg_level="WARNING"}'
                stages:
                  - template:
                      source: level
                      template: WARNING
            - match:
                selector: '{pg_level=~"ERROR|FATAL"}'
                stages:
                  - template:
                      source: level
                      template: ERROR
            - match:
                selector: '{pg_level="PANIC"}'
                stages:
                  - template:
                      source: level
                      template: CRITICAL
            - labels:
                level:
            - labeldrop:
                - pg_level
      # DETAIL, HINT, STATEMENT and CONTEXT parse but carry no severity of their
      # own. Counted apart from an unparsed record so the two stay tellable.
      - match:
          selector: '{service="postgres", level=""}'
          action: drop
          drop_counter_reason: postgres_continuation_record
      # Not one of trawl's 324 daily lines carries a severity token, so there is
      # nothing to parse and nothing is dropped: the solve rate is a ratio, and
      # dropping the routine attempt would remove its denominator. Plan 155
      # Stage 0 item 4 holds why the Tab+Space fallback is not WARNING here.
      - match:
          selector: '{service="trawl"}'
          stages:
            - template:
                source: level
                template: INFO
            - labels:
                level:
      - labels:
          stream:

  - job_name: ops
    static_configs:
      - targets:
          - localhost
        labels:
          service: ops
          source: application_file
          __path__: /logs/ops/app.log

    pipeline_stages:
      - json:
          expressions:
            ts: ts
            level: level
            logger: logger
      - labels:
          level:
          logger:
      - timestamp:
          source: ts
          format: '2006-01-02 15:04:05,000'
      - match:
          selector: '{service="ops", level=""}'
          action: drop
          drop_counter_reason: application_file_unclassified

