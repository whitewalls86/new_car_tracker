server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # Container stdout is normally only a bounded Docker transport buffer. Keep
  # the auth audit trail and Airflow control-plane logs in Loki, while excluding
  # Loki itself (which would create a feedback loop) and low-value containers.
  - job_name: docker-operations
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
    relabel_configs:
      - target_label: job
        replacement: docker-operations
      - source_labels: ['__meta_docker_container_name']
        regex: '/cartracker-(oauth2-proxy|airflow-(dag-processor|scheduler|apiserver))'
        action: keep
      - source_labels: ['__meta_docker_container_name']
        regex: '/cartracker-(.+)'
        target_label: service
        replacement: '$1'
    pipeline_stages:
      - docker: {}
      - labels:
          stream:

  - job_name: ops
    static_configs:
      - targets:
          - localhost
        labels:
          service: ops
          __path__: /logs/ops/app.log*

    pipeline_stages:
      - json:
          expressions:
            ts: ts
            level: level
            logger: logger
      - labels:
          level:
          logger:
      - timestamp:
          source: ts
          format: '2006-01-02 15:04:05,000'

  - job_name: scraper
    static_configs:
      - targets:
          - localhost
        labels:
          service: scraper
          __path__: /logs/scraper/app.log*

    pipeline_stages:
      - json:
          expressions:
            ts: ts
            level: level
            logger: logger
      - labels:
          level:
          logger:
      - timestamp:
          source: ts
          format: '2006-01-02 15:04:05,000'

  - job_name: processing
